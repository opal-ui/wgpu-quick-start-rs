[package]
name = "wgpu_quick_start"
version = "0.28.7"
edition = "2024"
license = "MIT"
keywords = ["wgpu", "rust-windowing", "graphics", "winit"]
description = "A starter package to get started with wgpu library"
repository = "https://github.com/opal-ui/wgpu-quick-start-rs"
readme = "README.md"
homepage = "https://opal-ui.github.io/wgpu-quick-start-rs/"


[lib]
name="wgpu_quick_start"

[features]
default=["dep:winit"]
## Feature that provides an API to create [`MyDeviceImpl`] without a `winit` window instance. Useful for unit testing.
enable-sync=["dep:pollster"]

## Feature that provides an API to create an instance of [`MyDeviceImpl`] given a `winit` instance
enable-sync-winit=["dep:pollster", "dep:winit"]

[package.metadata.docs.rs]
# To doc all features
all-features = true
# You would see why we do this later
# As a side note, docs.rs build doc with nightly cargo 
rustdoc-args = ["--cfg", "enable-sync-winit"]

[dependencies]
wgpu = { version = "28", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal", "gles"] }
thiserror = "2.0.17"
log="0.4"
pollster = {version ="0.4.0" , optional=true}
winit = { version = "0.31.0-beta.2", optional=true, features = ["android-native-activity"] }
bytemuck = { version = "1.24", features = [ "derive" ] }
document-features = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "28", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}
 


[dev-dependencies]
winit_app = {version="0.31"}
